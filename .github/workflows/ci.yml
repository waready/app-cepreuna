name: Validar y desplegar aplicacion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_DRIVER: array
      SESSION_DRIVER: array
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, mbstring, pdo_mysql
          coverage: none

      - name: Preparar archivo de entorno
        run: |
          mkdir -p storage/app/public
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          cp .env.example .env

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Descubrir paquetes de Laravel
        run: php artisan package:discover --ansi --verbose

      - name: Probar panel Docente
        run: |
          php artisan test tests/Unit
          php artisan test tests/Feature/DocenteModulesTest.php
          php artisan test tests/Feature/BancoPreguntasSchemaTest.php

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Compilar frontend
        run: |
          npm ci
          npm run production

  deploy-production:
    name: Desplegar a produccion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: [self-hosted, linux, x64, app-cepreuna]
    timeout-minutes: 20
    concurrency:
      group: app-cepreuna-production
      cancel-in-progress: false
    steps:
      - name: Descargar commit validado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Desplegar release atomico
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git push /var/repositories/app-cepreuna.git HEAD:refs/heads/main
